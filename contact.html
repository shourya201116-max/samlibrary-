<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us - Sam Library Nagpur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { 600: '#059669' }, navy: { 900: '#0f172a' } } } } }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white"><i class="fa-solid fa-chair text-lg"></i></div>
                <span class="text-xl font-extrabold text-navy-900">SAM <span class="text-brand-600">LIBRARY</span></span>
            </a>
            <nav class="hidden md:flex gap-6 font-bold text-xs uppercase tracking-wider text-slate-600">
                <a href="index.html" class="hover:text-brand-600">Home</a>
                <a href="seats.html" class="hover:text-brand-600">50 Seats Map</a>
                <a href="enquiry.html" class="hover:text-brand-600">Enquiry</a>
                <a href="student-portal.html" class="hover:text-brand-600">Student Portal</a>
                <a href="plans.html" class="hover:text-brand-600">Plans</a>
                <a href="contact.html" class="text-brand-600 border-b-2 border-brand-600">Contact</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow py-16">
        <div class="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white p-8 rounded-3xl border border-slate-200 space-y-4">
                <h3 class="text-2xl font-serif font-bold text-navy-900">Visit Nagpur Branch</h3>
                <p class="text-xs text-slate-600"><i class="fa-solid fa-location-dot text-brand-600 mr-2"></i> Plot No. 1, Bante Layout, Hudkeshwar Main Road, Beside Wellness Forever, Nagpur, Maharashtra</p>
                <p class="text-xs text-slate-600"><i class="fa-solid fa-phone text-brand-600 mr-2"></i> +91 90216 32248</p>
                <p class="text-xs text-slate-600"><i class="fa-solid fa-envelope text-brand-600 mr-2"></i> info@samlibrary.org</p>
            </div>
            <div class="bg-white p-8 rounded-3xl border border-slate-200">
                <h3 class="text-xl font-bold text-navy-900 mb-4">Send Direct Message</h3>
                <form onsubmit="alert('Message sent!'); e.preventDefault();" class="space-y-3 text-xs">
                    <input type="text" placeholder="Your Name" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3">
                    <input type="tel" placeholder="Mobile Number" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3">
                    <textarea placeholder="Message..." rows="4" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3"></textarea>
                    <button class="w-full bg-brand-600 text-white font-bold p-3 rounded-xl uppercase">Send Message</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>

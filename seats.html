<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50 Seats Floor Map - Sam Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], serif: ['Playfair Display', 'serif'] },
                    colors: { brand: { 50: '#f0fdf4', 100: '#dcfce7', 600: '#059669', 700: '#047857' }, navy: { 900: '#0f172a' } }
                }
            }
        }
    </script>
</head>
<body class="font-sans bg-slate-50 text-slate-800 antialiased flex flex-col min-h-screen">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white"><i class="fa-solid fa-chair text-lg"></i></div>
                <span class="text-xl font-extrabold text-navy-900">SAM <span class="text-brand-600">LIBRARY</span></span>
            </a>
            <nav class="hidden md:flex gap-6 font-bold text-xs uppercase tracking-wider text-slate-600">
                <a href="index.html" class="hover:text-brand-600">Home</a>
                <a href="seats.html" class="text-brand-600 border-b-2 border-brand-600">50 Seats Map</a>
                <a href="enquiry.html" class="hover:text-brand-600">Enquiry</a>
                <a href="student-portal.html" class="hover:text-brand-600">Student Portal</a>
                <a href="plans.html" class="hover:text-brand-600">Plans</a>
                <a href="contact.html" class="hover:text-brand-600">Contact</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
            <div>
                <span class="text-xs font-extrabold uppercase text-brand-700 bg-brand-50 px-3 py-1 rounded-full border border-brand-200">50 Seats Grid</span>
                <h1 class="text-3xl font-serif font-bold text-navy-900 mt-2">Interactive Workstation Floor Map</h1>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                <div class="lg:col-span-8 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-6">
                    <div class="text-xs font-bold text-brand-700 uppercase">Zone A: Silent Reading Pods (Seats 01 – 25)</div>
                    <div id="grid-zone-a" class="grid grid-cols-5 sm:grid-cols-8 gap-2"></div>

                    <div class="text-xs font-bold text-navy-900 uppercase pt-4 border-t border-slate-100">Zone B: Power Workstations (Seats 26 – 50)</div>
                    <div id="grid-zone-b" class="grid grid-cols-5 sm:grid-cols-8 gap-2"></div>
                </div>

                <div class="lg:col-span-4 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                    <h3 class="text-lg font-serif font-bold text-navy-900">Reserve Selected Seat</h3>
                    <form onsubmit="handleReserve(event)" class="space-y-3 text-xs">
                        <input id="selected-seat" type="text" readonly value="Click a desk on left map" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-bold text-brand-700">
                        <input id="res-name" type="text" placeholder="Full Name" required class="w-full border border-slate-200 rounded-xl p-3">
                        <input id="res-phone" type="tel" placeholder="Mobile Number" required class="w-full border border-slate-200 rounded-xl p-3">
                        <select id="res-shift" class="w-full border border-slate-200 rounded-xl p-3">
                            <option>Full Day Pass (07:00 AM – 11:00 PM)</option>
                            <option>Morning Shift (07:00 AM – 01:00 PM)</option>
                            <option>Evening Shift (01:00 PM – 07:00 PM)</option>
                        </select>
                        <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold p-3.5 rounded-xl uppercase tracking-wider text-xs">Confirm Seat Booking</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        let selectedId = null;
        let seats = JSON.parse(localStorage.getItem('sam_seats_data')) || [];

        if(seats.length === 0) {
            for(let i=1; i<=50; i++) {
                seats.push({ id: i, seatNum: i<10?`0${i}`:`${i}`, status: i===1?'booked':'available', bookingInfo: i===1?{studentId:'SL-2026-1001', name:'Rahul Sharma', phone:'9021632248', shift:'Full Day Pass'}:null });
            }
            localStorage.setItem('sam_seats_data', JSON.stringify(seats));
        }

        function renderMap() {
            const za = document.getElementById('grid-zone-a');
            const zb = document.getElementById('grid-zone-b');
            za.innerHTML = ''; zb.innerHTML = '';

            seats.forEach(s => {
                const btn = document.createElement('button');
                btn.className = `p-3 rounded-xl font-bold text-xs flex flex-col items-center gap-1 ${
                    s.status==='booked' ? 'bg-rose-50 text-rose-700 cursor-not-allowed' :
                    selectedId===s.id ? 'bg-brand-600 text-white scale-105' : 'bg-emerald-50 text-emerald-800 hover:bg-emerald-100'
                }`;
                btn.innerHTML = `<i class="fa-solid fa-chair"></i><span>${s.seatNum}</span>`;
                if(s.status === 'available') btn.onclick = () => { selectedId = s.id; document.getElementById('selected-seat').value = `Seat #${s.seatNum}`; renderMap(); };
                
                if(s.id <= 25) za.appendChild(btn); else zb.appendChild(btn);
            });
        }

        function handleReserve(e) {
            e.preventDefault();
            if(!selectedId) return alert('Select a seat first.');
            const name = document.getElementById('res-name').value;
            const phone = document.getElementById('res-phone').value;
            const shift = document.getElementById('res-shift').value;
            const seat = seats.find(s=>s.id===selectedId);
            seat.status = 'booked';
            seat.bookingInfo = { studentId: `SL-2026-${1000+selectedId}`, name, phone, shift };

            localStorage.setItem('sam_seats_data', JSON.stringify(seats));
            alert(`Seat #${seat.seatNum} booked for ${name}! ID: ${seat.bookingInfo.studentId}`);
            window.location.href = 'student-portal.html';
        }

        document.addEventListener("DOMContentLoaded", renderMap);
    </script>
</body>
</html>
